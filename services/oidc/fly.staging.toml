app = "cubid-oidc-staging"
primary_region = "yyz"
kill_signal = "SIGINT"
kill_timeout = "5s"

[env]
  NODE_ENV = "production"
  OIDC_PORT = "8080"
  OIDC_ISSUER_URL = "https://staging-id.cubid.me"
  OIDC_PUBLIC_ORIGIN = "https://staging-id.cubid.me"
  OIDC_CORS_ALLOWED_ORIGINS = "https://passport.cubid.me,https://passport-preview.cubid.me"
  OIDC_PASSKEY_RP_ID = "cubid.me"
  OIDC_PASSKEY_RP_NAME = "Cubid Passport"
  OIDC_PASSKEY_EXPECTED_ORIGINS = "https://passport.cubid.me,https://passport-preview.cubid.me"
  OIDC_FIREBASE_JWKS_URL = "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
  PASSPORT_LOGIN_URL = "https://passport.cubid.me/login"
  PASSPORT_CONSENT_URL = "https://passport.cubid.me/allow"
  PASSPORT_PUBLIC_ORIGIN = "https://passport.cubid.me"
  TCOIN_OIDC_CLIENT_NAME = "TCOIN"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
