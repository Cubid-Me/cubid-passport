name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish @cubid/api to npm using Trusted Publishing"
        required: true
        default: false
        type: boolean
      publish_jsr:
        description: "Publish @cubid/api to JSR using trusted publishing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate @cubid/api
        run: |
          pnpm --filter @cubid/api test
          pnpm --filter @cubid/api typecheck
          pnpm --filter @cubid/api build
          pnpm --filter @cubid/api pack:dry-run
          pnpm --filter @cubid/api jsr:dry-run

      - name: Publish @cubid/api to npm
        if: ${{ inputs.publish_npm }}
        run: npm publish --workspace @cubid/api --access public --provenance

      - name: Publish @cubid/api to JSR
        if: ${{ inputs.publish_jsr }}
        working-directory: packages/api
        run: pnpm dlx jsr publish
